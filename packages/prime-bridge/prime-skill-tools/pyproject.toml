[project]
name = "prime-agent-skill-omp-tools"
version = "0.1.0"
description = "Prime Agent skill for calling tools from a live OMP session"
requires-python = ">=3.10"
dependencies = ["mcp", "httpx", "prime-agent-runtime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omp_tools"]
